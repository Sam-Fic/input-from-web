<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<meta name="theme-color" content="#F5EBF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Apply the saved theme before first paint to avoid a flash of the wrong palette. -->
<script src="/static/theme-init.js"></script>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>__TITLE__</title>

<!-- Material 3 Expressive (@m3e/web) Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">

<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="theme-host" style="display:contents">
<m3e-theme id="app-theme" variant="expressive" color="#6750A4" scheme="auto" style="display:contents">
<!-- Seed <m3e-theme> with the saved accent BEFORE it upgrades, so it generates the
     user palette from the very first paint (no Material-default-purple flash during load).
     app.js later re-applies the same value; this just removes the dependency on its timing. -->
<script>
  try {
    var _t = document.getElementById("app-theme");
    var _c = localStorage.getItem("input-from-web-theme-color");
    if (_c && _c !== "material") _t.setAttribute("color", _c);
    var _k = localStorage.getItem("input-from-web-contrast");
    if (_k && _k !== "standard") _t.setAttribute("contrast", _k);
  } catch (e) {}
</script>
<div class="app-container">
  <div class="btn-row">
    <m3e-button id="btn" variant="filled" size="large">
      <m3e-icon slot="icon" name="send" variant="outlined"></m3e-icon><span class="btn-label">SEND</span>
    </m3e-button>
    <m3e-icon-button id="clear-btn" variant="standard">
      <m3e-icon name="delete" variant="outlined"></m3e-icon>
    </m3e-icon-button>
    <m3e-icon-button id="settings-btn" variant="standard" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-sheet">
      <m3e-icon name="tune" variant="outlined"></m3e-icon>
    </m3e-icon-button>
  </div>

  <div class="input-field">
    <div class="field-box">
      <label class="flt-label" for="txt">__LABEL_TYPE_HERE__</label>
      <textarea id="txt" rows="4" placeholder="&#8203;"></textarea>
    </div>
  </div>

  <div class="nav-row">
    <m3e-icon-button id="nav-left" variant="standard" disabled>
      <m3e-icon name="chevron_left" variant="outlined"></m3e-icon>
    </m3e-icon-button>
    <div class="nav-center">
      <div class="nav-mid">
        <div class="nav-info" id="nav-info"></div>
      </div>
    </div>
    <m3e-icon-button id="nav-right" variant="standard" disabled>
      <m3e-icon name="chevron_right" variant="outlined"></m3e-icon>
    </m3e-icon-button>
  </div>
</div>

<!-- Settings live in a modal bottom sheet (drag handle, swipe to dismiss,
     fit-to-content height) instead of occupying rows in the main layout. -->
<m3e-bottom-sheet id="settings-sheet" modal handle hideable detents="fit" aria-labelledby="settings-sheet-header">
  <div slot="header" id="settings-sheet-header" class="sheet-header" data-i18n="settings_title">设置</div>
  <div class="sheet-body">
    <m3e-list variant="segmented" class="settings-list">
      <m3e-list-item>
        <span class="autostart-label" data-i18n="autostart_label">开机自启（登录后自动弹终端显示二维码）</span>
        <m3e-switch slot="trailing" icons="both" id="autostart-switch"></m3e-switch>
      </m3e-list-item>

      <m3e-list-item>
        <span class="autostart-label" data-i18n="method_label">剪贴板模式（复制粘贴，而非直接键入）</span>
        <m3e-switch slot="trailing" icons="both" id="method-switch"></m3e-switch>
      </m3e-list-item>

      <m3e-list-item>
        <span class="autostart-label" data-i18n="auto_paste_label">复制后自动粘贴（剪贴板模式下生效）</span>
        <m3e-switch slot="trailing" icons="both" id="auto-paste-switch"></m3e-switch>
      </m3e-list-item>

      <m3e-list-item>
        <span class="autostart-label" data-i18n="paste_key_label">粘贴快捷键使用 Ctrl+Shift+V（默认 Ctrl+V）</span>
        <m3e-switch slot="trailing" icons="both" id="paste-key-switch"></m3e-switch>
      </m3e-list-item>

      <m3e-list-item>
        <span class="autostart-label" data-i18n="enter_label">发送后自动按 Enter</span>
        <m3e-switch slot="trailing" icons="both" id="enter-switch"></m3e-switch>
      </m3e-list-item>

      <m3e-list-item>
        <span class="autostart-label" data-i18n="voice_label">语音指令：说 “send” 自动发送</span>
        <m3e-switch slot="trailing" icons="both" id="voice-switch"></m3e-switch>
      </m3e-list-item>

      <m3e-list-item>
        <span class="autostart-label" data-i18n="token_label">启用安全令牌（URL 携带密钥）</span>
        <m3e-switch slot="trailing" icons="both" id="token-switch"></m3e-switch>
      </m3e-list-item>

      <!-- Value rows: the whole row opens the menu. The m3e-menu-trigger wraps
           the row title and listens on its parent (the m3e-list-item), so a
           click on any part of the row toggles the menu exactly once. The
           trailing m3e-button stays the keyboard control: it is focusable, gets
           the visible focus ring and Enter/Space activate it natively. Its
           accessible name combines the row title and the current value. -->
      <m3e-list-item id="lang-row" class="settings-option-row">
        <m3e-menu-trigger for="lang-menu">
          <span class="autostart-label" id="lang-label" data-i18n="lang_switch_label">界面语言</span>
        </m3e-menu-trigger>
        <m3e-button slot="trailing" variant="text" size="small" class="settings-option" id="lang-btn" aria-labelledby="lang-label lang-value">
          <span class="settings-option-value" id="lang-value">中文</span>
        </m3e-button>
      </m3e-list-item>

      <m3e-list-item id="theme-row" class="settings-option-row">
        <m3e-menu-trigger for="theme-menu">
          <span class="autostart-label" id="theme-label" data-i18n="theme_switch_label">主题</span>
        </m3e-menu-trigger>
        <m3e-button slot="trailing" variant="text" size="small" class="settings-option" id="theme-btn" aria-labelledby="theme-label theme-value">
          <span class="settings-option-value" id="theme-value" data-i18n="theme_auto">自动</span>
        </m3e-button>
      </m3e-list-item>

      <m3e-list-item id="contrast-row" class="settings-option-row">
        <m3e-menu-trigger for="contrast-menu">
          <span class="autostart-label" id="contrast-label" data-i18n="contrast_switch_label">对比度</span>
        </m3e-menu-trigger>
        <m3e-button slot="trailing" variant="text" size="small" class="settings-option" id="contrast-btn" aria-labelledby="contrast-label contrast-value">
          <span class="settings-option-value" id="contrast-value" data-i18n="contrast_standard">标准</span>
        </m3e-button>
      </m3e-list-item>

      <m3e-list-item id="accent-row" class="settings-option-row">
        <m3e-menu-trigger for="accent-menu">
          <span class="autostart-label" id="accent-label" data-i18n="theme_color_label">主题色</span>
        </m3e-menu-trigger>
        <m3e-button slot="trailing" variant="text" size="small" class="settings-option" id="accent-btn" aria-labelledby="accent-label accent-value">
          <span class="settings-option-value" id="accent-value" data-i18n="accent_default">默认（Material）</span>
        </m3e-button>
      </m3e-list-item>
    </m3e-list>

    <input type="file" id="wallpaper-input" accept="image/*" hidden>
  </div>

  <!-- Option menus for the value rows above. They must live *inside* the sheet:
       a modal m3e-bottom-sheet marks its siblings inert, and an inert menu is
       painted (popover top layer) but cannot be clicked or focused. The popover
       itself still escapes the sheet's clipping/scroll, and being in the sheet
       subtree means picking an option is an inside click, so the sheet no
       longer treats it as "clicked outside" and dismisses itself. -->
  <m3e-menu id="lang-menu" position-x="before" position-y="below">
    <m3e-menu-item-radio data-value="zh" checked>中文</m3e-menu-item-radio>
    <m3e-menu-item-radio data-value="en">English</m3e-menu-item-radio>
  </m3e-menu>

  <m3e-menu id="theme-menu" position-x="before" position-y="below">
    <m3e-menu-item-radio data-value="light" data-i18n="theme_light">浅色</m3e-menu-item-radio>
    <m3e-menu-item-radio data-value="dark" data-i18n="theme_dark">深色</m3e-menu-item-radio>
    <m3e-menu-item-radio data-value="auto" data-i18n="theme_auto">自动</m3e-menu-item-radio>
  </m3e-menu>

  <m3e-menu id="contrast-menu" position-x="before" position-y="below">
    <m3e-menu-item-radio data-value="standard" data-i18n="contrast_standard">标准</m3e-menu-item-radio>
    <m3e-menu-item-radio data-value="medium" data-i18n="contrast_medium">中等</m3e-menu-item-radio>
    <m3e-menu-item-radio data-value="high" data-i18n="contrast_high">高</m3e-menu-item-radio>
  </m3e-menu>

  <m3e-menu id="accent-menu" position-x="before" position-y="below">
    <m3e-menu-item-radio data-value="material" data-i18n="accent_default">默认（Material）</m3e-menu-item-radio>
    <m3e-menu-item id="accent-extract-item" data-value="extract">
      <m3e-icon slot="icon" name="image" variant="outlined"></m3e-icon>
      <span data-i18n="theme_extract">从图片提取</span>
    </m3e-menu-item>
  </m3e-menu>
</m3e-bottom-sheet>

<!-- Material 3 Expressive (@m3e/web) -->
<!-- m3e builds on Lit + tslib + its own core; the dist files use bare specifiers,
     so we publish an import map before the module script loads. -->
<script type="importmap">
{
  "imports": {
    "tslib": "https://cdn.jsdelivr.net/npm/tslib@2.8.1/+esm",
    "lit": "https://cdn.jsdelivr.net/npm/lit@3.3.0/+esm",
    "lit/": "https://cdn.jsdelivr.net/npm/lit@3.3.0/",
    "lit-html": "https://cdn.jsdelivr.net/npm/lit-html@3.3.0/+esm",
    "lit-html/": "https://cdn.jsdelivr.net/npm/lit-html@3.3.0/",
    "lit-html/directive.js": "https://cdn.jsdelivr.net/npm/lit-html@3.3.0/directive.js",
    "lit-html/directives/if-defined.js": "https://cdn.jsdelivr.net/npm/lit-html@3.3.0/directives/if-defined.js",
    "lit-html/directives/class-map.js": "https://cdn.jsdelivr.net/npm/lit-html@3.3.0/directives/class-map.js",
    "@lit/reactive-element": "https://cdn.jsdelivr.net/npm/@lit/reactive-element@2.0.4/+esm",
    "@lit/reactive-element/": "https://cdn.jsdelivr.net/npm/@lit/reactive-element@2.0.4/",
    "@m3e/web/core": "https://cdn.jsdelivr.net/npm/@m3e/web@2.7.9/dist/core.min.js",
    "@m3e/web/core/a11y": "https://cdn.jsdelivr.net/npm/@m3e/web@2.7.9/dist/core-a11y.min.js",
    "@m3e/web/core/bidi": "https://cdn.jsdelivr.net/npm/@m3e/web@2.7.9/dist/core-bidi.min.js",
    "@m3e/web/core/anchoring": "https://cdn.jsdelivr.net/npm/@m3e/web@2.7.9/dist/core-anchoring.min.js",
    "@m3e/web/button": "https://cdn.jsdelivr.net/npm/@m3e/web@2.7.9/dist/button.min.js",
    "@m3e/web/icon": "https://cdn.jsdelivr.net/npm/@m3e/web@2.7.9/dist/icon.min.js",
    "@m3e/web/icon-button": "https://cdn.jsdelivr.net/npm/@m3e/web@2.7.9/dist/icon-button.min.js",
    "@m3e/web/switch": "https://cdn.jsdelivr.net/npm/@m3e/web@2.7.9/dist/switch.min.js",
    "@m3e/web/snackbar": "https://cdn.jsdelivr.net/npm/@m3e/web@2.7.9/dist/snackbar.min.js",
    "@m3e/web/bottom-sheet": "https://cdn.jsdelivr.net/npm/@m3e/web@2.7.9/dist/bottom-sheet.min.js",
    "@m3e/web/list": "https://cdn.jsdelivr.net/npm/@m3e/web@2.7.9/dist/list.min.js",
    "@m3e/web/menu": "https://cdn.jsdelivr.net/npm/@m3e/web@2.7.9/dist/menu.min.js",
    "@m3e/web/theme": "https://cdn.jsdelivr.net/npm/@m3e/web@2.7.9/dist/theme.min.js",
    "@material/material-color-utilities": "https://cdn.jsdelivr.net/npm/@material/material-color-utilities@0.3.0/+esm"
  }
}
</script>
<!-- One ES module: load m3e via import map, then wait until every custom element is upgraded
     before touching the DOM. This avoids race conditions where page logic runs
     against un-upgraded <m3e-*> elements. -->
<script type="application/json" id="app-config">__CONFIG__</script>
<script type="module" src="/static/app.js"></script>
</m3e-theme>
</div>
</body>
</html>
