name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to attach the release to (e.g. v1.2.0). The tag must already exist."
        required: true

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create icon.icns from icon.png
        run: |
          set -euxo pipefail
          sips -c 764 764 icon.png --out icon-square.png
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icon-square.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2))
            sips -z $d $d icon-square.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns
          ls -la icon.icns
      - name: Resolve version (setuptools-scm)
        run: |
          pip install setuptools-scm
          # Use the tag itself as the version. A manual dispatch from master
          # (e.g. to retry a failed job) sits ahead of the tag, and
          # setuptools-scm would otherwise report a 1.2.0.postN.devM version.
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Unable to determine the release tag" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "IFW_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: |
          pip install flask qrcode pytest
          python -m pytest -q
      - name: Build wheel + sdist
        run: |
          pip install --upgrade pip build
          python -m build --outdir dist
      - name: Build standalone .app (py2app)
        run: |
          set -euxo pipefail
          pip install setuptools-scm py2app flask qrcode
          python setup.py py2app
      - name: Sanity check the .app bundle
        run: |
          set -euxo pipefail
          PY="python$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          APP="dist/Input from Web.app"
          APP_BIN="$APP/Contents/MacOS/Input from Web"
          test -x "$APP_BIN"
          "$APP_BIN" --help | head -30
          find "$APP/Contents/Resources" -name index.html -o -name app.js | head -10
          test -f "$APP/Contents/Resources/lib/$PY/site-packages/input_from_web/templates/index.html"
          test -f "$APP/Contents/Resources/lib/$PY/site-packages/input_from_web/static/app.js"
          test -f "$APP/Contents/Resources/lib/$PY/input_from_web/_version.py"
      - name: Package .app as DMG
        run: |
          set -euxo pipefail
          pkill -f "Input from Web.app" 2>/dev/null || true
          APP="dist/Input from Web.app"
          DMG="dist/input-from-web-${{ env.IFW_VERSION }}-macos-arm64.dmg"
          for attempt in 1 2 3 4; do
            if hdiutil create -volname "Input from Web" \
              -srcfolder "$APP" \
              -ov -format UDZO "$DMG"; then
              break
            fi
            echo "hdiutil attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          test -f "$DMG" && ls -la "$DMG"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  linux-deb:
    name: Build Linux .deb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version (setuptools-scm)
        run: |
          pip install setuptools-scm
          # Use the tag itself as the version. A manual dispatch from master
          # (e.g. to retry a failed job) sits ahead of the tag, and
          # setuptools-scm would otherwise report a 1.2.0.postN.devM version.
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Unable to determine the release tag" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "IFW_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python pybuild-plugin-pyproject dpkg-dev
      - name: Build .deb
        run: |
          set -euxo pipefail
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          DEB=$(ls ../input-from-web_*.deb | head -n 1)
          mv "$DEB" "dist/input-from-web-${IFW_VERSION}-linux-all.deb"
          ls -la dist
          dpkg-deb --info "dist/input-from-web-${IFW_VERSION}-linux-all.deb"
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  windows:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version (setuptools-scm)
        shell: bash
        run: |
          pip install setuptools-scm
          # Use the tag itself as the version. A manual dispatch from master
          # (e.g. to retry a failed job) sits ahead of the tag, and
          # setuptools-scm would otherwise report a 1.2.0.postN.devM version.
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Unable to determine the release tag" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "IFW_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pillow
      - name: Create icon.ico from icon.png
        run: |
          python -c "from PIL import Image; img = Image.open('icon.png').convert('RGBA'); img.save('icon.ico', sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])"
          Get-Item icon.ico | Format-List Name, Length
      - name: Build single-file executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name input-from-web --icon icon.ico --runtime-hook packaging/pyinstaller_runtime_hook.py --paths src --add-data "src/input_from_web/templates;input_from_web/templates" --add-data "src/input_from_web/static;input_from_web/static" input-from-web.py
          Get-Item dist\input-from-web.exe | Format-List Name, Length
      - name: Smoke test the executable
        shell: pwsh
        env:
          PYTHONIOENCODING: "utf-8"
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist\input-from-web.exe"
          if (-not (Test-Path $exe)) { throw "executable missing: $exe" }
          & $exe --help | Out-String | Write-Host

          $cfgPath = Join-Path $env:USERPROFILE ".input-from-web-conf.json"
          $cfg = @{
            default_profile = "default"
            profiles = @{
              default = @{ method = "clipboard"; use_security_token = $false; port = 5199 }
            }
          } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText($cfgPath, $cfg, (New-Object System.Text.UTF8Encoding($false)))

          $outFile = Join-Path $env:RUNNER_TEMP "ifw-out.txt"
          $errFile = Join-Path $env:RUNNER_TEMP "ifw-err.txt"
          $proc = Start-Process -FilePath $exe -ArgumentList "--port", "5199" -RedirectStandardOutput $outFile -RedirectStandardError $errFile -PassThru -NoNewWindow

          $servedUrl = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            if (-not (Test-Path $outFile)) { continue }
            $text = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
            if ($text -match "http://\d+\.\d+\.\d+\.\d+:5199") {
              try {
                $resp = Invoke-WebRequest -Uri "$($Matches[0])/" -UseBasicParsing -TimeoutSec 5
                if ($resp.StatusCode -eq 200 -and $resp.Content.Length -gt 100) {
                  $servedUrl = "$($Matches[0])/"
                  break
                }
              } catch {
                # server not ready yet; retry
              }
            }
          }

          if (-not $servedUrl) {
            Write-Host "--- stdout ---"
            Get-Content $outFile -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"
            Get-Content $errFile -ErrorAction SilentlyContinue
            throw "the packaged executable did not serve the mobile UI"
          }

          Write-Host "served mobile UI at $servedUrl"
          Get-Process input-from-web -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
      - name: Package zip
        shell: pwsh
        run: |
          $zip = "dist\input-from-web-${env:IFW_VERSION}-windows-x64.zip"
          Compress-Archive -Path dist\input-from-web.exe -DestinationPath $zip -Force
          Get-Item $zip | Format-List Name, Length
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, linux-deb, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          # Tag-triggered runs derive the tag from the ref; manual runs use the
          # workflow_dispatch input (the tag must already exist in the repo).
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          ls -la artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating assets only"
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "input-from-web $TAG" \
              --generate-notes
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
